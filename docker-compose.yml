version: '3.6'
services:
  postgres:
    image: postgres:11.1
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    env_file:
      - '.env'
  backend:
    depends_on:
      - postgres
    build: ./backend
    command: bundle exec rails s -p 3000 -b '0.0.0.0'
    volumes:
      - .:/bandit
    ports:
      - "3000:3000"
  frontend:
    build: ./frontend
    command: yarn run start
    volumes:
      - .:/bandit
    ports:
      - "8080:8080"
    
volumes:
  postgres:
