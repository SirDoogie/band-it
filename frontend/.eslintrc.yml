plugins:
  - babel
  - jest
  - react
  - import

extends:
  - airbnb-base
  - eslint:recommended
  - plugin:jest/recommended
  - plugin:react/recommended
  - plugin:import/errors
  - plugin:import/warnings

rules:
  react/prop-types: 0
  import/prefer-default-export: 0
  import/no-unresolved: 0
  import/no-extraneous-dependencies: 0
  no-console: 0
  semi: [2, never]
  quotes: [2, single]

parser: babel-eslint

env:
  browser: true
  node: true
  jest: true

settings:
  import/resolver:
    webpack:
      config: "webpack.config.dev.babel.js"
  react:
    version: "16.7"
