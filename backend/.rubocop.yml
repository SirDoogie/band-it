require: rubocop-rspec, rubocop-performance
AllCops:
  TargetRubyVersion: 2.5
  Exclude:
    - 'bin/*'
    - 'spec/spec_helper.rb'
    - 'db/schema.rb'
    - 'spec/support/shared_db_connection.rb'
Rails:
  Enabled: true
Metrics/LineLength:
  Max: 130
Style/Documentation:
  Enabled: false
Metrics/MethodLength:
  Max: 30
Metrics/BlockLength:
  ExcludedMethods: ['describe', 'context']
Style/FrozenStringLiteralComment:
  Enabled: false
Style/ClassAndModuleChildren:
  EnforcedStyle: nested
