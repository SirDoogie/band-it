require: rubocop-rspec
AllCops:
  TargetRubyVersion: 2.5
  Exclude:
    - 'bin/*'
    - 'spec/spec_helper.rb'
    - 'db/schema.rb'
Rails:
  Enabled: true
Metrics/LineLength:
  Max: 120
Style/Documentation:
  Enabled: false
Metrics/MethodLength:
  Max: 30
Metrics/BlockLength:
  ExcludedMethods: ['describe', 'context']
Style/FrozenStringLiteralComment:
  Enabled: false
